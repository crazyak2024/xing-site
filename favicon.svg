<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="32" height="32">
<!-- 页签那份**刻意不是** logo.svg 的副本：缝张得更开、笔画更粗、瞳孔更大、两端更收。
     16px 上细笔画和窄缝会糊成一团，那时它既不是眼也不是缝，只是一个脏点。 -->
  <rect width="96" height="96" rx="14" fill="#1a1a1a"/>
  <g fill="none" stroke="#fff" stroke-width="8.5">
    <path d="M 12,48 C 28,48 34,25 48,25 C 62,25 68,48 84,48"/>
    <path d="M 12,48 C 28,48 34,71 48,71 C 62,71 68,48 84,48"/>
  </g>
  <circle cx="48" cy="48" r="7" fill="#fff"/>
</svg>
