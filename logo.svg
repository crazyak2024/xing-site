<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
<!-- 「醒」的标识：**一条横线被撑开成一道缝**（CY 2026-11-10 20:3x 选 ey3）。
     它同时是两个意思：睁开的眼（「醒」的字面动作），和一条被顶开的信息流。

     ⚠️ 前一版是「被切开的无限符号」，CY 一句话判了死刑：**看着像手铐**。
     病根是结构性的、不是画歪了——∞ 从腰上切开，中心那个交叉点就没了，
     剩下两个等大的闭合环并排，那就是手铐。压扁、调角度、加大错位全试过，救不了
     （过程和四张对照图在仓库 `brand/`）。

     ⚠️ 眼要这么画才读得出是眼：**两条对称外鼓的弧**（上下眼睑）、两端收回到**同一条
     水平线**上。用「横线＋正圆＋小圆点」画出来的是**螺栓**，不是眼——第一版就栽在这儿。
     两端落在同一条线上是要害：少了它就只是一只眼，有了它才是"一条线被撑开"。 -->
  <g fill="none" stroke="currentColor" stroke-width="6.5">
    <path d="M 8,48 C 25,48 33,29 48,29 C 63,29 71,48 88,48"/>
    <path d="M 8,48 C 25,48 33,67 48,67 C 63,67 71,48 88,48"/>
  </g>
  <circle cx="48" cy="48" r="5" fill="currentColor"/>
</svg>
