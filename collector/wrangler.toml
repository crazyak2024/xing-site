name = "xing-bi"
main = "worker.js"
compatibility_date = "2026-11-01"

# 自定义域而不是 workers.dev：这个账号还没注册 workers.dev 子域（账号级一次性设置，
# 要在 dashboard 点），而 vectorherd.com 整域已在本账号的 Cloudflare 上，custom_domain
# 会自动建 DNS 记录，一条命令完事。CY 2026-11-07 08:2x 拍的：站点本来就是临时站，
# 以后整体迁 live.vozo.ai 时 BI 一起迁。
routes = [{ pattern = "bi.vectorherd.com", custom_domain = true }]

[[d1_databases]]
binding = "DB"
database_name = "xing-bi"
database_id = "9f61e002-bda1-4641-a658-44626405c95f"

# Workers AI：语义搜索用 @cf/baai/bge-m3 把查询词向量化。零新凭据（同账号），
# 免费层 10,000 neurons/天 ≈ 9.3M input tokens/天。CY 2026-11-09「能用就用」批。
[ai]
binding = "AI"
